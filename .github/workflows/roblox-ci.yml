name: roblox-ci

on:
  push:
    branches: [main, "work/**"]
    paths: ["roblox/**", ".github/workflows/roblox-ci.yml"]
  pull_request:
    paths: ["roblox/**", ".github/workflows/roblox-ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: roblox-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned tools with archive verification
        run: |
          $pins = Get-Content roblox/tool-versions.json -Raw | ConvertFrom-Json
          $platformKey = if ($env:RUNNER_OS -eq 'Windows') { 'windows' } else { 'linux' }
          foreach ($toolName in @('rojo', 'stylua', 'luau', 'luau-lsp')) {
            $asset = $pins.$toolName.$platformKey
            $archive = Join-Path $env:RUNNER_TEMP "$toolName.zip"
            $toolDir = Join-Path $env:RUNNER_TEMP $toolName
            Invoke-WebRequest -Uri $asset.url -OutFile $archive
            if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $asset.sha256) {
              throw "$toolName archive checksum mismatch"
            }
            Expand-Archive -LiteralPath $archive -DestinationPath $toolDir
            if ($env:RUNNER_OS -ne 'Windows') {
              & chmod +x (Join-Path $toolDir $toolName)
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              if ($toolName -eq 'luau') { & chmod +x (Join-Path $toolDir 'luau-compile') }
            }
            $toolDir >> $env:GITHUB_PATH
          }
          $definitions = $pins.'roblox-definitions'
          $definitionPath = Join-Path $env:RUNNER_TEMP 'roblox.d.luau'
          Invoke-WebRequest -Uri $definitions.url -OutFile $definitionPath
          if ((Get-FileHash $definitionPath -Algorithm SHA256).Hash.ToLowerInvariant() -ne $definitions.sha256) {
            throw 'Roblox type definitions checksum mismatch'
          }
      - name: Check Luau formatting
        run: stylua --check --config-path roblox/stylua.toml roblox/src
      - name: Compile scripts and run inventory regression cases
        run: python roblox/tests/run.py
      - name: Analyze Luau with Roblox definitions
        working-directory: roblox
        run: |
          New-Item -ItemType Directory -Force ../build | Out-Null
          rojo sourcemap default.project.json -o ../build/sourcemap.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $definitionPath = Join-Path $env:RUNNER_TEMP 'roblox.d.luau'
          luau-lsp analyze --platform=roblox --sourcemap=../build/sourcemap.json "--definitions=$definitionPath" src
      - name: Build local Roblox place
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          rojo build roblox/default.project.json -o build/dont-wake-the-house.rbxlx
      - uses: actions/upload-artifact@v4
        with:
          name: DontWakeTheHouse-${{ matrix.os }}
          path: build/dont-wake-the-house.rbxlx
      - name: Explain verification boundary
        run: |
          "Formatting, Luau compilation, mock-service regression cases and Rojo assembly passed. Studio Script Analysis, physics, multiplayer, touch UI and real Marketplace/DataStore checks are still required." >> $env:GITHUB_STEP_SUMMARY
